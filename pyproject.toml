[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-conformance-suite"
version = "0.1.2"
description = "Run rubric-spec adapter conformance checks and render deterministic status badges."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AuraOne" }]
keywords = ["llm-evaluation", "rubric", "conformance-testing", "adapter-testing", "evals", "quality-assurance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["rubric-spec>=0.1.1"]

[project.urls]
Homepage = "https://github.com/auraoneai/eval-conformance-suite"
Documentation = "https://github.com/auraoneai/eval-conformance-suite#readme"
Repository = "https://github.com/auraoneai/eval-conformance-suite.git"
Issues = "https://github.com/auraoneai/eval-conformance-suite/issues"
Changelog = "https://github.com/auraoneai/eval-conformance-suite/blob/main/CHANGELOG.md"

[project.scripts]
eval-conformance-suite = "eval_conformance_suite.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
